<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FightMemo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

header{
    padding:32px 24px;
    border-bottom:1px solid #333;
}

h1{
    font-size:36px;
}

.subtitle{
    color:#999;
    margin-top:8px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:24px;
}

.card{
    background:#1b1b1b;
    border:1px solid #2d2d2d;
    border-radius:14px;
    padding:22px;
    margin-bottom:18px;
    transition:.2s;
}

.card:hover{
    border-color:#666;
}

.date{
    color:#ff4d4d;
    font-weight:bold;
    margin-bottom:10px;
}

.event{
    font-size:22px;
    font-weight:bold;
    margin-bottom:14px;
}

.fighters{
    color:#ddd;
    line-height:1.8;
}

</style>

</head>

<body>

<header>

<h1>🥊 FightMemo</h1>

<div class="subtitle">
格闘技スケジュールをひとつに。
</div>

</header>

<div class="container">

<div class="card">

<div class="date">
7月26日
</div>

<div class="event">
RIZIN LANDMARK
</div>

<div class="fighters">
朝倉未来<br>
平本蓮
</div>

</div>

<div class="card">

<div class="date">
8月3日
</div>

<div class="event">
世界タイトルマッチ
</div>

<div class="fighters">
井上尚弥<br>
対戦相手未定
</div>

</div>

<div class="card">

<div class="date">
8月16日
</div>

<div class="event">
ONE Championship
</div>

<div class="fighters">
武尊<br>
スーパーレック
</div>

</div>

</div>

</body>
</html>
